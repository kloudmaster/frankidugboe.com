name: Terraform PR Plan

# Runs on every pull request so the required status checks below always report
# a result. The expensive Terraform and scanner steps only execute when
# infrastructure-related files actually change; otherwise the jobs succeed
# immediately. This keeps the checks required on main without blocking
# docs-only or app-only pull requests.
on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect infrastructure changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            infra:
              - "infrastructure/**"
              - ".terraform-version"
              - ".tflint.hcl"
              - ".checkov.yaml"
              - ".trivyignore"
              - ".github/workflows/terraform-plan.yml"

  terraform:
    name: Terraform validate and plan
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout repository
        if: needs.changes.outputs.infra == 'true'
        uses: actions/checkout@v7

      - name: Set up Terraform
        if: needs.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: needs.changes.outputs.infra == 'true'
        run: terraform fmt -check -recursive infrastructure

      - name: Initialize IAM module
        if: needs.changes.outputs.infra == 'true'
        run: terraform -chdir=infrastructure/modules/iam init -backend=false -input=false

      - name: Test IAM module
        if: needs.changes.outputs.infra == 'true'
        run: terraform -chdir=infrastructure/modules/iam test

      - name: Initialize production configuration for tests
        if: needs.changes.outputs.infra == 'true'
        run: terraform -chdir=infrastructure/environments/production init -backend=false -input=false

      - name: Test production IAM composition
        if: needs.changes.outputs.infra == 'true'
        run: |
          terraform -chdir=infrastructure/environments/production test \
            -filter=tests/iam.tftest.hcl

      - name: Test production DNS composition
        if: needs.changes.outputs.infra == 'true'
        run: |
          terraform -chdir=infrastructure/environments/production test \
            -filter=tests/dns.tftest.hcl

      - name: Validate production configuration
        if: needs.changes.outputs.infra == 'true'
        run: terraform -chdir=infrastructure/environments/production validate

      - name: Configure AWS credentials with GitHub OIDC
        if: needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::216066926519:role/frankidugboe-com-github-plan
          aws-region: us-east-1
          role-session-name: github-terraform-plan

      - name: Initialize production backend
        if: needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          terraform -chdir=infrastructure/environments/production \
            init -reconfigure -input=false

      - name: Terraform plan
        if: needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TF_VAR_ses_recipient: ${{ secrets.SES_RECIPIENT }}
        run: |
          terraform -chdir=infrastructure/environments/production \
            plan -input=false -no-color -lock-timeout=5m

      - name: No infrastructure changes
        if: needs.changes.outputs.infra != 'true'
        run: echo "No infrastructure changes in this pull request; skipping Terraform plan."

  security:
    name: IaC security checks
    runs-on: ubuntu-latest
    needs: changes

    # Deliberately no id-token permission here.
    # Security scanners do not need AWS credentials.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        if: needs.changes.outputs.infra == 'true'
        uses: actions/checkout@v7

      - name: Set up TFLint
        if: needs.changes.outputs.infra == 'true'
        uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint plugins
        if: needs.changes.outputs.infra == 'true'
        run: tflint --init --config=.tflint.hcl

      - name: Run TFLint
        if: needs.changes.outputs.infra == 'true'
        run: tflint --recursive --config="$(pwd)/.tflint.hcl" --format=compact

      - name: Set up Python
        if: needs.changes.outputs.infra == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Checkov
        if: needs.changes.outputs.infra == 'true'
        run: python -m pip install --disable-pip-version-check checkov==3.3.18

      - name: Run Checkov
        if: needs.changes.outputs.infra == 'true'
        run: checkov -d infrastructure --framework terraform --compact --skip-path '(^|.*/)tests(/.*)?$'

      - name: Run Trivy IaC scan
        if: needs.changes.outputs.infra == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: v0.74.0
          hide-progress: true

      - name: No infrastructure changes
        if: needs.changes.outputs.infra != 'true'
        run: echo "No infrastructure changes in this pull request; skipping IaC scans."
