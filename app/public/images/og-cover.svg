<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Frank Osasere Idugboe — Cloud & DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="60%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- accent bar -->
  <rect x="80" y="150" width="64" height="6" rx="3" fill="#38bdf8"/>

  <text x="80" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="4" fill="#7dd3fc">CLOUD · DEVOPS · INFRASTRUCTURE AS CODE</text>

  <text x="78" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" fill="#ffffff">Frank Osasere Idugboe</text>

  <text x="80" y="340" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" fill="#cbd5e1">Cloud &amp; DevOps Engineer · Digital Forensics Researcher</text>

  <text x="80" y="452" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#94a3b8">AWS · Kubernetes · Terraform · Cloud Security · Observability</text>

  <!-- pills -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">
    <rect x="80" y="512" width="150" height="56" rx="28" fill="#1e293b" stroke="#334155"/>
    <text x="105" y="549">AWS</text>
    <rect x="248" y="512" width="210" height="56" rx="28" fill="#1e293b" stroke="#334155"/>
    <text x="273" y="549">Kubernetes</text>
    <rect x="476" y="512" width="185" height="56" rx="28" fill="#1e293b" stroke="#334155"/>
    <text x="501" y="549">Terraform</text>
    <rect x="679" y="512" width="240" height="56" rx="28" fill="#1e293b" stroke="#334155"/>
    <text x="704" y="549">AWS Builder</text>
  </g>

  <text x="1120" y="590" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#38bdf8">frankidugboe.com</text>
</svg>
